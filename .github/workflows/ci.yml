name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Run golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run

      - name: Run Tests with Race Detector and Coverage
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Coverage Threshold (>= 75%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          echo "Total Statement Coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 75.0) { print "Coverage below 75%"; exit 1 } }'

      - name: Build Docker Image Check
        run: |
          docker build -t aqueduct:ci .
