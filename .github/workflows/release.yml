name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cross-Compile Binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          
          # linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/aqueduct-broker ./cmd/broker
          tar -czvf dist/aqueduct-${VERSION}-linux-amd64.tar.gz -C dist aqueduct-broker
          rm dist/aqueduct-broker
          
          # linux/arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/aqueduct-broker ./cmd/broker
          tar -czvf dist/aqueduct-${VERSION}-linux-arm64.tar.gz -C dist aqueduct-broker
          rm dist/aqueduct-broker

          # darwin/amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/aqueduct-broker ./cmd/broker
          tar -czvf dist/aqueduct-${VERSION}-darwin-amd64.tar.gz -C dist aqueduct-broker
          rm dist/aqueduct-broker

          # darwin/arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/aqueduct-broker ./cmd/broker
          tar -czvf dist/aqueduct-${VERSION}-darwin-arm64.tar.gz -C dist aqueduct-broker
          rm dist/aqueduct-broker

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
