# Aqueduct Message Broker Configuration (v1.9.0)

# UDP listen address for QUIC broker
listen_addr: ":4242"

# HTTP listen address for Prometheus metrics (/metrics) and health checks (/healthz)
metrics_addr: ":9090"

# TLS & mTLS Configuration (TLS 1.3 strictly required)
tls:
  # Set to true to generate ephemeral self-signed certificates for development
  generate: true
  cert_file: ""
  key_file: ""
  require_client_cert: false
  client_ca_file: "" # Path to PEM-encoded Client CA certificate for mTLS

# Encrypted Append-Only Logging (AAL) Configuration
aal:
  enabled: false
  file_path: ""
  key: "" # Base64 encoded 32-byte key for AES-256-GCM encryption

# Authorization ACL (Zero-Allocation SoA Bitmask Matrix)
acl:
  enabled: false
  default: "none" # "none" or "all"
  rules:
    - client: "service-a"
      topic: "orders"
      permission: "publish"
    - client: "service-b"
      topic: "orders"
      permission: "subscribe"

# Async Fan-Out & Slow Consumer Isolation Policy
broker:
  queue_size: 1024               # Per-subscriber ring queue capacity
  backpressure_policy: "drop_oldest" # "drop_oldest", "drop_newest", or "disconnect"
  batch_size: 65536              # Coalesced write batch size in bytes (default 64 KB)
  flush_interval: 50us           # Micro-timer flush interval (default 50 µs)
  max_retries: 3                 # Max NACK retries before moving to DLQ (default 3)
  priority_ttls: ["500ms", "5s", "0", "0"] # Per-priority message TTL constraints (0 = no TTL)

  # Per-tenant rate limiting (Token Bucket)
  quotas:
    default_publish_rate: 0    # default publish rate limit (msg/s), 0 = unlimited
    default_burst_size: 1000   # default burst size

# Cluster Peer Federation & DNS Discovery
cluster:
  peers: []                     # Static peer addresses e.g. ["node-b:4242", "node-c:4242"]
  discovery:
    enabled: false              # Enable DNS-based peer discovery (Kubernetes Headless Service)
    type: "dns"                 # Discovery type: "dns" (only option for MVP)
    host: ""                    # Headless service FQDN e.g. "aqueduct-headless.default.svc.cluster.local"
    port: "4242"                # Port suffix for resolved IPs (default: extracted from listen_addr)
    interval: "10s"             # DNS polling interval

# OpenTelemetry Distributed Tracing (experimental, v1.8.0)
tracing:
  enabled: false          # Set to true to enable OTLP export
  service_name: "aqueduct-broker" # Service name for trace identification
  endpoint: "localhost:4317"      # OTLP gRPC endpoint

# Transport & Memory Hardening Limits
transport:
  max_buf_size: 65536     # 64 KB maximum buffer limit per stream
  read_buf_size: 1024     # 1 KB initial read buffer per stream
