# Aqueduct Message Broker Configuration (v1.0.0)

# UDP listen address for QUIC broker
listen_addr: ":4242"

# HTTP listen address for Prometheus metrics (/metrics) and health checks (/healthz)
metrics_addr: ":9090"

# TLS & mTLS Configuration (TLS 1.3 strictly required)
tls:
  # Set to true to generate ephemeral self-signed certificates for development
  generate: true
  cert_file: ""
  key_file: ""
  require_client_cert: false
  client_ca_file: "" # Path to PEM-encoded Client CA certificate for mTLS

# Encrypted Append-Only Logging (AAL) Configuration
aal:
  enabled: false
  file_path: ""
  key: "" # Base64 encoded 32-byte key for AES-256-GCM encryption

# Authorization ACL (Zero-Allocation SoA Bitmask Matrix)
acl:
  enabled: false
  default: "none" # "none" or "all"
  rules:
    - client: "service-a"
      topic: "orders"
      permission: "publish"
    - client: "service-b"
      topic: "orders"
      permission: "subscribe"

# Async Fan-Out & Slow Consumer Isolation Policy
broker:
  queue_size: 1024               # Per-subscriber ring queue capacity
  backpressure_policy: "drop_oldest" # "drop_oldest", "drop_newest", or "disconnect"

# Transport & Memory Hardening Limits
transport:
  max_buf_size: 65536     # 64 KB maximum buffer limit per stream
  read_buf_size: 1024     # 1 KB initial read buffer per stream
