apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aqueduct.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aqueduct.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aqueduct.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "aqueduct.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aqueduct.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if or (.Values.serviceAccount.create) (.Values.serviceAccount.name) }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "aqueduct.fullname" .) }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      containers:
        - name: broker
          # image tag is set via .Values.image.tag and defaults to .Chart.AppVersion (NOT latest). NOSONAR S6596: Helm templating is not recognized by Sonar.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}" # NOSONAR S6596
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config"
            - "/etc/aqueduct/config.yaml"
          ports:
            - name: quic
              containerPort: {{ .Values.service.quicPort }}
              protocol: UDP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/aqueduct/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /var/lib/aqueduct
            {{- end }}
          resources:
            {{- $reqs := default (dict "ephemeral-storage" "1Gi") .Values.resources.requests -}}
            {{- $lims := default (dict "ephemeral-storage" "2Gi") .Values.resources.limits -}}
            {{- toYaml (dict "requests" $reqs "limits" $lims) | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "exit 0"
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "exit 0"
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "aqueduct.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
